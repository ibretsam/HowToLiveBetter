name: Vietnamese GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - vi/**
      - book/**
      - docs/**
      - README.md
      - LICENSE
      - tools/build-vi-site.py
      - tools/check-vi-site.py
      - tools/check-vi.py
      - tools/vi_segments.py
      - tools/vi_updates.py
      - tools/check-vi-updates.py
      - tools/test-vi-updates.py
      - tools/assemble-vi.py
      - tools/epub/package*.json
      - translation-checkpoint/**
      - .github/workflows/vietnamese-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietnamese-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ibretsam/HowToLiveBetter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json
      - run: npm --prefix tools/epub ci
      - name: Validate pinned Vietnamese drafts
        run: python3 tools/check-vi.py
      - name: Validate current-source drafts and independent reviews
        run: python3 tools/check-vi-updates.py
      - name: Check translation validation rejects damaged records
        run: python3 tools/test-vi-updates.py
      - name: Build every current chapter and article
        run: python3 tools/build-vi-site.py
      - name: Check coverage and translation status
        run: python3 tools/check-vi-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vi-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
